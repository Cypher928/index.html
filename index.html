<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustLedger — XRPL Wallet Auditor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --accent:  #58a6ff;
      --accent2: #3fb950;
      --warn:    #d29922;
      --danger:  #f85149;
      --text:    #c9d1d9;
      --muted:   #8b949e;
      --radius:  10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header { text-align: center; margin-bottom: 36px; }
    header h1 { font-size: 2rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    header p  { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .badge {
      display: inline-block;
      background: #1f2937;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.75rem;
      color: var(--accent2);
      margin-top: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .search-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .search-row input {
      flex: 1;
      min-width: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-row input:focus        { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--muted); }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active   { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-demo    { background: #21262d; color: var(--warn); border: 1px solid var(--border); }

    /* Spinner */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 36px 0;
    }
    .spinner-wrap.active { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: #1c1012;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      padding: 16px 18px;
      color: var(--danger);
      font-size: 0.9rem;
    }
    .error-box.active { display: block; }

    /* ── Score card ──────────────────────────────────────────────── */
    .score-section { display: none; }
    .score-section.active { display: block; }

    .score-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: center;
    }

    .gauge-wrap { flex-shrink: 0; }
    .gauge-bg   { stroke: #30363d; }
    .gauge-fill {
      stroke: #3fb950;
      stroke-dasharray: 173;
      stroke-dashoffset: 173;
      transition: stroke-dashoffset 0.8s ease, stroke 0.4s ease;
    }
    .gauge-num { font-size: 20px; font-weight: 700; fill: #c9d1d9; }
    .gauge-lbl { font-size: 8px;  fill: #8b949e; letter-spacing: 1px; }

    .score-details h3 { font-size: 1rem; margin-bottom: 6px; }
    .score-details p  { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

    /* Stat cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .stat-box .stat-num { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .stat-box .stat-lbl { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }

    /* Score breakdown */
    .score-breakdown { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
    .score-breakdown h4 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .adj-list { display: flex; flex-direction: column; gap: 6px; }
    .adj-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .adj-delta { font-weight: 700; font-size: 0.8rem; min-width: 40px; text-align: right; flex-shrink: 0; }
    .adj-bonus     .adj-delta { color: var(--accent2); }
    .adj-deduction .adj-delta { color: var(--danger); }
    .adj-cat {
      font-size: 0.67rem; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; background: #1a2030; color: var(--accent);
      white-space: nowrap; flex-shrink: 0;
    }
    .adj-reason { color: var(--text); flex: 1; line-height: 1.4; }
    .adj-severity-critical .adj-reason { color: var(--danger); }
    .adj-severity-warning  .adj-reason { color: var(--warn); }
    .breakdown-footer {
      margin-top: 10px;
      font-size: 0.73rem;
      color: var(--muted);
      text-align: right;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* ── Export row ─────────────────────────────────────────────── */
    .export-row {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    .btn-export {
      background: #161b22;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: var(--radius);
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-export:hover  { background: #1a2535; }
    .btn-export:active { transform: scale(0.97); }

    /* ── Audit Timeline ──────────────────────────────────────────── */
    .tx-section { display: none; }
    .tx-section.active { display: block; }
    .tx-section > h2 {
      margin-bottom: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
    }

    .audit-timeline { display: flex; flex-direction: column; }

    .timeline-day-group { margin-bottom: 6px; }

    .timeline-day-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 14px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .timeline-day-header::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    .timeline-events { display: flex; flex-direction: column; gap: 8px; }

    .audit-event {
      display: grid;
      grid-template-columns: 3px 1fr;
      gap: 12px;
    }
    .event-spine { border-radius: 3px; background: var(--border); min-height: 100%; }
    .audit-event.risk-High   .event-spine { background: var(--danger); }
    .audit-event.risk-Medium .event-spine { background: var(--warn); }
    .audit-event.risk-Low    .event-spine { background: var(--accent2); }
    .audit-event.risk-None   .event-spine { background: var(--border); }

    .event-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .event-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .event-header-left  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .event-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .risk-badge {
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    .risk-badge.risk-High   { background: #1c1012; color: var(--danger);  border-color: var(--danger); }
    .risk-badge.risk-Medium { background: #1f1a0a; color: var(--warn);    border-color: var(--warn); }
    .risk-badge.risk-Low    { background: #0d2818; color: var(--accent2); border-color: var(--accent2); }
    .risk-badge.risk-None   { background: #1a2030; color: var(--muted);   border-color: var(--border); }

    .event-type { font-size: 0.85rem; font-weight: 600; color: var(--text); }

    .score-impact-chip {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .score-impact-chip.neg { color: var(--danger);  background: #1c1012; }
    .score-impact-chip.pos { color: var(--accent2); background: #0d2818; }

    .event-time {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: monospace;
      white-space: nowrap;
    }

    .event-description {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .rule-count { font-size: 0.72rem; color: var(--muted); }

    .expand-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .expand-btn:hover  { background: var(--surface); }
    .expand-btn:active { transform: none; }

    /* Expanded detail panel */
    .event-detail {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .flagged-header {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .flagged-rules { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }

    .flagged-rule {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface);
      border-radius: 6px;
      border-left: 3px solid var(--border);
    }
    .flagged-rule.sev-critical { border-left-color: var(--danger); }
    .flagged-rule.sev-warning  { border-left-color: var(--warn); }
    .flagged-rule.sev-info     { border-left-color: var(--accent); }

    .rule-id-badge {
      font-family: monospace;
      font-size: 0.66rem;
      font-weight: 700;
      background: #1a2030;
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .rule-info    { flex: 1; min-width: 0; }
    .rule-reason  { font-size: 0.8rem; color: var(--text); margin-bottom: 3px; }
    .rule-evidence { font-size: 0.7rem; color: var(--muted); font-family: monospace; word-break: break-all; }

    .rule-delta {
      font-size: 0.73rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .event-tx-hash {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: monospace;
      padding: 5px 8px;
      background: var(--surface);
      border-radius: 4px;
      word-break: break-all;
      margin-top: 6px;
    }
    .event-memo {
      font-size: 0.73rem;
      color: var(--muted);
      padding: 5px 8px;
      background: #1a1f26;
      border-radius: 4px;
      margin-top: 6px;
    }

    footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 40px; }

    @media (max-width: 500px) {
      .score-grid { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <h1>TrustLedger</h1>
  <p>XRPL Wallet Auditor — Translate blockchain activity into plain English</p>
  <span class="badge">&#x25CF; Testnet Live</span>
</header>

<div class="card">
  <div class="search-row">
    <input id="walletInput" type="text" placeholder="Enter XRPL wallet address (r...)" spellcheck="false" />
    <button class="btn-primary" id="auditBtn" onclick="auditWallet()">Audit Wallet</button>
    <button class="btn-demo" onclick="loadDemo()">Load Demo</button>
  </div>
</div>

<div class="error-box" id="errorBox"></div>

<div class="spinner-wrap" id="spinner">
  <div class="spinner"></div>
  <span style="color:var(--muted);font-size:0.85rem;">Connecting to XRPL testnet…</span>
</div>

<div class="card score-section" id="scoreSection">
  <div class="score-grid">
    <div class="gauge-wrap">
      <svg width="140" height="90" viewBox="0 0 140 90" aria-label="Trust score gauge">
        <path class="gauge-bg"   d="M 15 78 A 55 55 0 0 1 125 78" fill="none" stroke-width="12" stroke-linecap="round"/>
        <path class="gauge-fill" id="gaugeFill" d="M 15 78 A 55 55 0 0 1 125 78" fill="none" stroke-width="12" stroke-linecap="round"/>
        <text class="gauge-num"  id="gaugeNum" x="70" y="72" text-anchor="middle">—</text>
        <text class="gauge-lbl"  x="70" y="86" text-anchor="middle">TRUST SCORE</text>
      </svg>
    </div>
    <div class="score-details">
      <h3 id="scoreLabel">—</h3>
      <p id="scoreDesc">—</p>
    </div>
  </div>
  <div class="stats-row"      id="statsRow"></div>
  <div class="score-breakdown" id="scoreBreakdown"></div>
  <div class="export-row" id="exportRow" hidden>
    <button class="btn-export" onclick="exportPDF()">&#x1F4C4;&thinsp; Export Compliance Report</button>
  </div>
</div>

<div class="card tx-section" id="txSection">
  <h2 id="txHeading">Audit Timeline</h2>
  <div class="audit-timeline" id="auditTimeline"></div>
</div>

<footer>TrustLedger &mdash; powered by XRPL Testnet &mdash; wss://s.altnet.rippletest.net:51233</footer>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// 1. CONSTANTS
// ═══════════════════════════════════════════════════════════════

const XRPL_WS      = 'wss://s.altnet.rippletest.net:51233';
const EPOCH_OFFSET = 946684800;
const GAUGE_ARC    = 172.79;
const GAUGE_COLORS = { high: '#3fb950', medium: '#d29922', low: '#f85149' };

let _auditState = null; // populated after each audit or demo; consumed by exportPDF()

// ═══════════════════════════════════════════════════════════════
// 2a. SCORING_RULES — portfolio-level (evaluate whole tx list)
// These produce the authoritative Trust Score shown in the gauge.
// Do not remove or reorder; TX_RULES reference the same IDs.
// ═══════════════════════════════════════════════════════════════

const SCORING_RULES = [
  {
    id: 'HIST_001', category: 'History',
    evaluate(txs) {
      if (txs.length === 0)  return { delta: -20, reason: 'No transaction history found',                                       severity: 'critical' };
      if (txs.length < 3)   return { delta: -10, reason: `Very limited history — only ${txs.length} transaction(s) on record`, severity: 'warning'  };
      if (txs.length < 10)  return { delta: -5,  reason: `Limited history — ${txs.length} transactions (fewer than 10)`,       severity: 'info'     };
      return null;
    }
  },
  {
    id: 'HIST_002', category: 'History',
    evaluate(txs) {
      if (txs.length >= 20) return { delta: +10, reason: `Established wallet — ${txs.length} transactions on record`, severity: 'info' };
      if (txs.length >= 10) return { delta: +5,  reason: `Active wallet — ${txs.length} transactions on record`,      severity: 'info' };
      return null;
    }
  },
  {
    id: 'VOL_001', category: 'Volume',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'Payment' && parseInt(t._rawDrops || 0) > 100_000_000_000);
      if (hits.length > 0)
        return { delta: -15, reason: `${hits.length} very large payment(s) detected — over 100,000 XRP each`, severity: 'critical' };
      return null;
    }
  },
  {
    id: 'VOL_002', category: 'Volume',
    evaluate(txs) {
      const hits = txs.filter(t =>
        t.type === 'Payment' &&
        parseInt(t._rawDrops || 0) >  1_000_000_000 &&
        parseInt(t._rawDrops || 0) <= 100_000_000_000
      );
      if (hits.length > 0)
        return { delta: -8, reason: `${hits.length} large payment(s) detected — over 1,000 XRP`, severity: 'warning' };
      return null;
    }
  },
  {
    id: 'COMP_001', category: 'Compliance',
    evaluate(txs) {
      const failed = txs.filter(t => t.summary && t.summary.startsWith('[FAILED]'));
      if (!failed.length) return null;
      const penalty = Math.min(20, failed.length * 5);
      return { delta: -penalty, reason: `${failed.length} failed transaction(s) on record`, severity: failed.length >= 3 ? 'critical' : 'warning' };
    }
  },
  {
    id: 'COMP_002', category: 'Compliance',
    evaluate(txs) {
      const pays = txs.filter(t => t.type === 'Payment');
      if (pays.length < 2) return null;
      if (pays.filter(t => t.memo).length / pays.length >= 0.5)
        return { delta: +5, reason: 'Good memo discipline — over half of payments include reference notes', severity: 'info' };
      return null;
    }
  },
  {
    id: 'BEHAV_001', category: 'Behavioral',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'AccountDelete');
      if (hits.length > 0)
        return { delta: -20, reason: 'Account deletion detected — highest severity behavioral signal', severity: 'critical' };
      return null;
    }
  },
  {
    id: 'BEHAV_002', category: 'Behavioral',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'EscrowCreate');
      if (hits.length > 0)
        return { delta: +5, reason: `Uses escrow for ${hits.length > 1 ? hits.length + ' payments' : 'payments'} — responsible conditional payment practice`, severity: 'info' };
      return null;
    }
  },
  {
    id: 'BEHAV_003', category: 'Behavioral',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'SetRegularKey' || t.type === 'SignerListSet');
      if (hits.length > 2)
        return { delta: -10, reason: `Signing keys changed ${hits.length} times — unusual security activity`, severity: 'warning' };
      return null;
    }
  },
  {
    id: 'CNTR_001', category: 'Counterparty',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'TrustSet');
      if (hits.length > 5) return { delta: -8, reason: `${hits.length} trust lines created — verify all token issuers`, severity: 'warning' };
      if (hits.length > 2) return { delta: -3, reason: `${hits.length} trust lines created`,                             severity: 'info'    };
      return null;
    }
  },
  {
    id: 'CNTR_002', category: 'Counterparty',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'OfferCreate');
      if (hits.length > 10)
        return { delta: -5, reason: `High DEX trading activity — ${hits.length} open orders placed`, severity: 'info' };
      return null;
    }
  },
  {
    id: 'NFT_001', category: 'Counterparty',
    evaluate(txs) {
      const hits = txs.filter(t => t.type === 'NFTokenMint');
      if (hits.length > 10)
        return { delta: -5, reason: `${hits.length} NFTs minted — high-volume minting warrants review`, severity: 'info' };
      return null;
    }
  },
];

// ═══════════════════════════════════════════════════════════════
// 2b. TX_RULES — per-transaction evaluators
//
// Each rule receives one translated tx and returns null or:
//   { delta, reason, severity, evidence: {} }
//
// delta values here are INFORMATIONAL — shown in the timeline to
// indicate which tx triggered a signal and approximately how much
// it contributed. The authoritative score comes from SCORING_RULES.
//
// Adding a new rule: push one object here. Nothing else changes.
// ═══════════════════════════════════════════════════════════════

const TX_RULES = [
  {
    id: 'VOL_001', category: 'Volume',
    evaluate(tx) {
      if (tx.type !== 'Payment') return null;
      const drops = parseInt(tx._rawDrops || 0);
      if (drops > 100_000_000_000) {
        return {
          delta: -15, severity: 'critical',
          reason: 'Very large payment — over 100,000 XRP',
          evidence: { amountXRP: (drops / 1_000_000).toFixed(2), destination: tx.dest || '—' },
        };
      }
      return null;
    }
  },
  {
    id: 'VOL_002', category: 'Volume',
    evaluate(tx) {
      if (tx.type !== 'Payment') return null;
      const drops = parseInt(tx._rawDrops || 0);
      if (drops > 1_000_000_000 && drops <= 100_000_000_000) {
        return {
          delta: -8, severity: 'warning',
          reason: 'Large payment — over 1,000 XRP',
          evidence: { amountXRP: (drops / 1_000_000).toFixed(2), destination: tx.dest || '—' },
        };
      }
      return null;
    }
  },
  {
    id: 'COMP_001', category: 'Compliance',
    evaluate(tx) {
      if (tx.summary && tx.summary.startsWith('[FAILED]')) {
        const code = (tx.summary.match(/\(([^)]+)\)/) || [])[1] || 'unknown';
        return {
          delta: -5, severity: 'warning',
          reason: 'Transaction failed on-chain',
          evidence: { resultCode: code },
        };
      }
      return null;
    }
  },
  {
    id: 'COMP_002', category: 'Compliance',
    evaluate(tx) {
      if (tx.type === 'Payment' && tx.memo) {
        return {
          delta: 0, severity: 'info',
          reason: 'Payment includes memo reference — good audit trail',
          evidence: { memo: tx.memo },
        };
      }
      return null;
    }
  },
  {
    id: 'BEHAV_001', category: 'Behavioral',
    evaluate(tx) {
      if (tx.type === 'AccountDelete') {
        return {
          delta: -20, severity: 'critical',
          reason: 'Account deletion — all funds swept to destination',
          evidence: { destination: tx.dest || '—' },
        };
      }
      return null;
    }
  },
  {
    id: 'BEHAV_002', category: 'Behavioral',
    evaluate(tx) {
      if (tx.type === 'EscrowCreate') {
        return {
          delta: 0, severity: 'info',
          reason: 'Escrow payment — funds release on verified completion',
          evidence: { destination: tx.dest || '—' },
        };
      }
      return null;
    }
  },
  {
    id: 'BEHAV_003', category: 'Behavioral',
    evaluate(tx) {
      if (tx.type === 'SetRegularKey' || tx.type === 'SignerListSet') {
        return {
          delta: 0, severity: 'warning',
          reason: 'Signing key modification — review authorization',
          evidence: { transactionType: tx.type },
        };
      }
      return null;
    }
  },
  {
    id: 'CNTR_001', category: 'Counterparty',
    evaluate(tx) {
      if (tx.type === 'TrustSet') {
        return {
          delta: 0, severity: 'info',
          reason: 'New trust line established — verify token issuer',
          evidence: { destination: tx.dest || '—' },
        };
      }
      return null;
    }
  },
];

// ═══════════════════════════════════════════════════════════════
// 2c. SCORING ENGINE (unchanged — runs SCORING_RULES on full list)
// ═══════════════════════════════════════════════════════════════

function runTrustEngine(translations, context = {}) {
  const adjustments = [];
  for (const rule of SCORING_RULES) {
    try {
      const result = rule.evaluate(translations, context);
      if (!result) continue;
      adjustments.push({
        id: rule.id, category: rule.category,
        type: result.delta >= 0 ? 'bonus' : 'deduction',
        delta: result.delta, reason: result.reason, severity: result.severity || 'info',
      });
    } catch (e) { console.warn(`[Engine] Rule ${rule.id}:`, e.message); }
  }

  const totalDelta = adjustments.reduce((s, a) => s + a.delta, 0);
  const score      = Math.max(0, Math.min(100, 100 + totalDelta));

  let label, color;
  if      (score >= 70) { label = 'Trustworthy';   color = 'high';   }
  else if (score >= 40) { label = 'Moderate Risk'; color = 'medium'; }
  else                  { label = 'High Risk';      color = 'low';    }

  const total    = translations.length;
  const payments = translations.filter(t => t.type === 'Payment').length;
  const highRisk = translations.filter(t => t.risk === 'High').length;
  const medRisk  = translations.filter(t => t.risk === 'Medium').length;
  const failed   = translations.filter(t => t.summary && t.summary.startsWith('[FAILED]')).length;
  const deductions = adjustments.filter(a => a.type === 'deduction');

  const desc = deductions.length
    ? `Score based on ${total} transaction${total !== 1 ? 's' : ''}. ${deductions.length} issue${deductions.length > 1 ? 's' : ''} found — see breakdown below.`
    : `Score based on ${total} transaction${total !== 1 ? 's' : ''}. No issues detected.`;

  const statsHtml = `
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">Transactions</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--accent2)">${payments}</div><div class="stat-lbl">Payments</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--warn)">${medRisk}</div><div class="stat-lbl">Medium Risk</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--danger)">${highRisk}</div><div class="stat-lbl">High Risk</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--danger)">${failed}</div><div class="stat-lbl">Failed Txs</div></div>`;

  return { score, label, color, desc, adjustments, deductions, bonuses: adjustments.filter(a => a.type === 'bonus'), statsHtml };
}

// ═══════════════════════════════════════════════════════════════
// 3. AUDIT EVENT LAYER
// Normalizes translated transactions into structured audit events.
// Each event carries the triggeredRules array for timeline linkage.
// ═══════════════════════════════════════════════════════════════

function calculateRiskLevel(rules) {
  if (!rules.length) return 'None';
  if (rules.some(r => r.severity === 'critical')) return 'High';
  if (rules.some(r => r.severity === 'warning'))  return 'Medium';
  return 'Low';
}

function groupTransactionsByDate(events) {
  const groups = new Map();
  for (const ev of events) {
    const parts   = ev.timestamp.split(',');
    const dateKey = parts.length >= 2
      ? (parts[0].trim() + ', ' + parts[1].trim())
      : ev.timestamp.trim();
    if (!groups.has(dateKey)) groups.set(dateKey, []);
    groups.get(dateKey).push(ev);
  }
  return groups;
}

function summarizeRuleImpact(rules) {
  const total = rules.reduce((s, r) => s + r.delta, 0);
  if (total === 0) return null;
  return (total > 0 ? '+' : '') + total + ' pts';
}

function formatTimestamp(isoString) {
  if (!isoString) return '';
  try {
    return new Date(isoString).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  } catch { return isoString; }
}

function buildAuditEvents(translations) {
  return translations.map(tx => {
    const triggeredRules = [];

    for (const rule of TX_RULES) {
      try {
        const result = rule.evaluate(tx);
        if (!result) continue;
        triggeredRules.push({
          id:       rule.id,
          category: rule.category,
          delta:    result.delta,
          reason:   result.reason,
          severity: result.severity || 'info',
          evidence: result.evidence || {},
        });
      } catch (e) { console.warn(`[TxRule] ${rule.id}:`, e.message); }
    }

    return {
      txHash:                  tx.hash,
      timestamp:               tx.date,
      transactionType:         tx.type,
      plainType:               tx.plainType,
      plainEnglishDescription: tx.summary,
      riskLevel:               calculateRiskLevel(triggeredRules),
      scoreImpact:             summarizeRuleImpact(triggeredRules),
      memo:                    tx.memo,
      triggeredRules,
    };
  });
}

// ═══════════════════════════════════════════════════════════════
// 4. XRPL HELPERS
// ═══════════════════════════════════════════════════════════════

function xrplDateToHuman(t) {
  return new Date((t + EPOCH_OFFSET) * 1000).toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}
function dropsToXRP(d) {
  return (parseInt(d, 10) / 1_000_000).toLocaleString(undefined,
    { minimumFractionDigits: 2, maximumFractionDigits: 6 });
}
function shortAddr(a)  { return a ? a.slice(0, 8) + '…' + a.slice(-6) : '—'; }
function isValidXRPLAddress(a) { return /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/.test(a.trim()); }
function decodeMemo(m) {
  if (!m || !m.MemoData) return null;
  try {
    const s = m.MemoData.match(/.{1,2}/g).map(b => String.fromCharCode(parseInt(b, 16))).join('');
    return s.replace(/[^\x20-\x7E]/g, '').trim() || null;
  } catch { return null; }
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════
// 5. TRANSACTION TRANSLATOR
// ═══════════════════════════════════════════════════════════════

function translateTx(entry, wallet) {
  const tx       = entry.tx || entry;
  const meta     = entry.meta || entry.metaData || {};
  const type     = tx.TransactionType || 'Unknown';
  const date     = tx.date ? xrplDateToHuman(tx.date) : 'Unknown date';
  const acct     = tx.Account || '';
  const dest     = tx.Destination || '';
  const isSender = acct.toLowerCase() === wallet.toLowerCase();

  function fmt(a) {
    if (!a) return '';
    return typeof a === 'string'
      ? dropsToXRP(a) + ' XRP'
      : (parseFloat(a.value) || 0).toLocaleString() + ' ' + (a.currency || '?');
  }

  let summary = '', amount = '', risk = 'Low', plainType = type, _rawDrops = null;

  switch (type) {
    case 'Payment': {
      plainType = 'Payment'; amount = fmt(tx.Amount);
      _rawDrops = typeof tx.Amount === 'string' ? tx.Amount : null;
      summary   = isSender ? `Sent ${amount} to ${shortAddr(dest)}.` : `Received ${amount} from ${shortAddr(acct)}.`;
      const d   = parseInt(_rawDrops || 0);
      if      (d > 100_000_000_000) risk = 'High';
      else if (d > 1_000_000_000)   risk = 'Medium';
      break;
    }
    case 'EscrowCreate':  plainType = 'Escrow Created';    amount = fmt(tx.Amount); summary = `Locked ${amount} in escrow for ${shortAddr(dest)}.`;  risk = 'Medium'; break;
    case 'EscrowFinish':  plainType = 'Escrow Released';   summary = `Escrow funds released to ${shortAddr(dest)}.`; break;
    case 'EscrowCancel':  plainType = 'Escrow Cancelled';  summary = `Escrow cancelled, funds returned to ${shortAddr(acct)}.`; break;
    case 'OfferCreate':   plainType = 'DEX Trade (Offer)'; summary = `DEX order: pay ${fmt(tx.TakerPays)} for ${fmt(tx.TakerGets)}.`; risk = 'Medium'; break;
    case 'OfferDelete':   plainType = 'DEX Offer Cancelled'; summary = `Cancelled an open DEX order.`; break;
    case 'TrustSet': {
      plainType = 'Trust Line Set';
      const lim = tx.LimitAmount;
      summary = `Set a trust line for ${lim ? lim.currency : '?'} issued by ${shortAddr(lim ? lim.issuer : '')}.`;
      risk = 'Medium'; break;
    }
    case 'AccountSet':    plainType = 'Account Settings';  summary = `Updated account settings or flags.`; break;
    case 'AccountDelete': plainType = 'Account Deleted';   summary = `Account deleted, XRP sent to ${shortAddr(dest)}.`; risk = 'High'; break;
    case 'SetRegularKey': plainType = 'Regular Key Set';   summary = tx.RegularKey ? `Set signing key: ${shortAddr(tx.RegularKey)}.` : `Removed signing key.`; risk = 'Medium'; break;
    case 'SignerListSet': plainType = 'Multi-Sig Updated'; summary = `Updated multi-signature signer list.`; risk = 'Medium'; break;
    case 'NFTokenMint':   plainType = 'NFT Minted';        summary = `Minted a new NFT on XRPL.`; break;
    case 'NFTokenBurn':   plainType = 'NFT Burned';        summary = `Permanently destroyed an NFT.`; break;
    default:
      plainType = type.replace(/([A-Z])/g, ' $1').trim();
      summary   = `${plainType} transaction.`;
  }

  let memo = null;
  if (tx.Memos && tx.Memos[0]) memo = decodeMemo(tx.Memos[0].Memo);

  if (meta.TransactionResult && meta.TransactionResult !== 'tesSUCCESS') {
    risk    = 'High';
    summary = '[FAILED] ' + summary + ' (' + meta.TransactionResult + ')';
  }

  return { type, plainType, summary, date, hash: tx.hash || '', account: acct, dest, amount, risk, memo, isSender, _rawDrops };
}

// ─── Gauge ────────────────────────────────────────────────────────────────
function renderGauge(score, color) {
  const fill = document.getElementById('gaugeFill');
  const num  = document.getElementById('gaugeNum');
  fill.style.strokeDashoffset = GAUGE_ARC * (1 - score / 100);
  fill.style.stroke           = GAUGE_COLORS[color] || GAUGE_COLORS.high;
  num.style.fill              = GAUGE_COLORS[color] || '#c9d1d9';
  num.textContent             = score;
}

function renderScore({ score, label, desc, color, statsHtml, adjustments }) {
  renderGauge(score, color);

  document.getElementById('scoreDesc').textContent  = desc;
  if (statsHtml) document.getElementById('statsRow').innerHTML = statsHtml;
  renderBreakdown(adjustments);

}

// ─── Score breakdown panel ─────────────────────────────────────────────────────────
function renderBreakdown(adjustments) {
  const el = document.getElementById('scoreBreakdown');
  if (!adjustments || !adjustments.length) { el.innerHTML = ''; return; }

  const bonuses    = adjustments.filter(a => a.type === 'bonus');
  const deductions = adjustments.filter(a => a.type === 'deduction');
  const net        = adjustments.reduce((s, a) => s + a.delta, 0);

  const rows = [...bonuses, ...deductions].map(a => `
    <div class="adj-item adj-${a.type} adj-severity-${a.severity}">
      <span class="adj-delta">${a.delta >= 0 ? '+' : ''}${a.delta}</span>
      <span class="adj-cat">${escapeHtml(a.category)}</span>
      <span class="adj-reason">${escapeHtml(a.reason)}</span>
    </div>`).join('');

  el.innerHTML = `
    <h4>Score Breakdown</h4>
    <div class="adj-list">${rows}</div>
    <div class="breakdown-footer">
      Net adjustment: <strong>${net >= 0 ? '+' : ''}${net} pts</strong> &nbsp;&middot;&nbsp; Base score: 100
    </div>`;
}

// ─── Audit timeline ────────────────────────────────────────────────────────────
function renderAuditTimeline(events) {
  const container = document.getElementById('auditTimeline');
  container.innerHTML = '';

  if (!events.length) {
    container.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;">No audit events to display.</p>';
    document.getElementById('txSection').classList.add('active');
    return;
  }

  const groups   = groupTransactionsByDate(events);
  const fragment = document.createDocumentFragment();

  groups.forEach((dayEvents, dateKey) => {
    const groupEl = document.createElement('div');
    groupEl.className = 'timeline-day-group';

    const header = document.createElement('div');
    header.className   = 'timeline-day-header';
    header.textContent = dateKey;
    groupEl.appendChild(header);

    const eventsEl = document.createElement('div');
    eventsEl.className = 'timeline-events';
    dayEvents.forEach(ev => eventsEl.appendChild(buildEventCard(ev)));
    groupEl.appendChild(eventsEl);
    fragment.appendChild(groupEl);
  });

  container.appendChild(fragment);

  const count = events.length;
  document.getElementById('txHeading').textContent =
    `${count} Audit Event${count !== 1 ? 's' : ''}`;
  document.getElementById('txSection').classList.add('active');
}

function buildEventCard(event) {
  const wrapper = document.createElement('div');
  wrapper.className = `audit-event risk-${event.riskLevel}`;

  const spine = document.createElement('div');
  spine.className = 'event-spine';

  const card = document.createElement('div');
  card.className = 'event-card';

  const parts    = event.timestamp.split(',');
  const timePart = parts.length >= 3 ? parts.slice(2).join(',').trim() : event.timestamp;

  const impact      = event.scoreImpact;
  const impactClass = impact ? (impact.startsWith('+') ? 'pos' : 'neg') : '';
  const rules       = event.triggeredRules;
  const ruleLabel   = rules.length === 0 ? 'No rules triggered'
    : `${rules.length} rule${rules.length > 1 ? 's' : ''} triggered`;

  const badgeLabel = event.riskLevel === 'None' ? 'CLEAN' : event.riskLevel.toUpperCase() + ' RISK';

  card.innerHTML = `
    <div class="event-card-header">
      <div class="event-header-left">
        <span class="risk-badge risk-${escapeHtml(event.riskLevel)}">${badgeLabel}</span>
        <span class="event-type">${escapeHtml(event.plainType)}</span>
      </div>
      <div class="event-header-right">
        ${impact ? `<span class="score-impact-chip ${impactClass}">${escapeHtml(impact)}</span>` : ''}
        <span class="event-time">${escapeHtml(timePart)}</span>
      </div>
    </div>
    <div class="event-description">${escapeHtml(event.plainEnglishDescription)}</div>
    <div class="event-footer">
      <span class="rule-count">${ruleLabel}</span>
      ${rules.length ? `<button class="expand-btn" onclick="toggleEventDetail(this)">Why flagged? &#9660;</button>` : ''}
    </div>
    ${rules.length ? buildDetailPanel(event) : ''}
  `;

  wrapper.appendChild(spine);
  wrapper.appendChild(card);
  return wrapper;
}

function buildDetailPanel(event) {
  const rulesHtml = event.triggeredRules.map(rule => {
    const evidenceStr = Object.entries(rule.evidence)
      .map(([k, v]) => `${k}: ${v}`)
      .join(' · ');
    const deltaStr  = rule.delta !== 0
      ? `<span class="rule-delta" style="color:${rule.delta < 0 ? 'var(--danger)' : 'var(--accent2)'}">${rule.delta > 0 ? '+' : ''}${rule.delta}</span>`
      : '';
    return `
      <div class="flagged-rule sev-${rule.severity}">
        <span class="rule-id-badge">${escapeHtml(rule.id)}</span>
        <div class="rule-info">
          <div class="rule-reason">${escapeHtml(rule.reason)}</div>
          ${evidenceStr ? `<div class="rule-evidence">${escapeHtml(evidenceStr)}</div>` : ''}
        </div>
        ${deltaStr}
      </div>`;
  }).join('');

  const hashShort = event.txHash
    ? event.txHash.slice(0, 16) + '…' + event.txHash.slice(-8)
    : '';

  return `
    <div class="event-detail" hidden>
      <div class="flagged-header">Why was this flagged?</div>
      <div class="flagged-rules">${rulesHtml}</div>
      ${event.memo ? `<div class="event-memo">&#128221; Memo: ${escapeHtml(event.memo)}</div>` : ''}
      ${hashShort ? `<div class="event-tx-hash">Tx Hash: ${escapeHtml(hashShort)}</div>` : ''}
    </div>`;
}

function toggleEventDetail(btn) {
  const detail = btn.closest('.event-card').querySelector('.event-detail');
  if (!detail) return;
  const opening = detail.hidden;
  detail.hidden  = !opening;
  btn.innerHTML  = opening ? 'Hide detail &#9650;' : 'Why flagged? &#9660;';
}

// ═══════════════════════════════════════════════════════════════
// 7. XRPL WEBSOCKET
// ═══════════════════════════════════════════════════════════════

function fetchXRPLTransactions(address) {
  return new Promise((resolve, reject) => {
    let ws;
    const timeout = setTimeout(() => {
      try { ws && ws.close(); } catch {}
      reject(new Error('Connection timed out. The XRPL testnet did not respond in time.'));
    }, 15000);

    try { ws = new WebSocket(XRPL_WS); }
    catch {
      clearTimeout(timeout);
      reject(new Error('Could not open WebSocket. Check your internet connection.'));
      return;
    }

    ws.onopen = () => {
      showSpinner('Connected — fetching transactions…');
      ws.send(JSON.stringify({
        id: 1, command: 'account_tx', account: address,
        ledger_index_min: -1, ledger_index_max: -1, limit: 50, forward: false,
      }));
    };
    ws.onmessage = event => {
      clearTimeout(timeout);
      try {
        const data = JSON.parse(event.data);
        ws.close();
        if (data.error) {
          reject(new Error(data.error === 'actNotFound'
            ? 'Wallet not found on testnet. Check the address or fund the account first.'
            : 'XRPL error: ' + (data.error_message || data.error)));
          return;
        }
        resolve((data.result && data.result.transactions) || []);
      } catch { reject(new Error('Failed to parse XRPL response.')); }
    };
    ws.onerror = () => {
      clearTimeout(timeout);
      reject(new Error('WebSocket error. Could not reach XRPL testnet.'));
    };
  });
}

// ═══════════════════════════════════════════════════════════════

async function auditWallet() {
  const address = document.getElementById('walletInput').value.trim();
  hideError(); hideSections();

  if (!address)                     { showError('Please enter a wallet address.'); return; }
  if (!isValidXRPLAddress(address)) { showError('Invalid XRPL address. Must start with "r" and be 25–35 characters.'); return; }

  setAuditLoading(true);
  showSpinner('Connecting to XRPL testnet…');

  try {
    const rawList = await fetchXRPLTransactions(address);
    if (!rawList.length) {
      hideSpinner();
      showError('No transactions found. The account may be inactive or unfunded.');
      return;
    }
    const translations = rawList.map(e => translateTx(e, address));
    const report       = runTrustEngine(translations);
    const auditEvents  = buildAuditEvents(translations);
    hideSpinner();
    renderScore(report);
    renderAuditTimeline(auditEvents);
    _auditState = { score: report.score, label: report.label, adjustments: report.adjustments, auditEvents, walletAddress: address, network: 'XRPL Testnet' };
    document.getElementById('exportRow').removeAttribute('hidden');
  } catch (err) {
    hideSpinner();
    showError(err.message || 'Unexpected error. Please try again.');
  } finally {
    setAuditLoading(false);
  }
}

document.getElementById('walletInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') auditWallet();
});

// 9. COMPLIANCE PDF EXPORT
// Opens a styled audit report in a new window and triggers print.
// buildComplianceReport() consumes the normalized _auditState object
// (same schema used by the timeline renderer) — no second data model.
// ═══════════════════════════════════════════════════════════════

function buildComplianceReport(data) {
  const { score, label, adjustments, auditEvents, walletAddress, network } = data;

  const now = new Date().toLocaleString(undefined, {
    year: 'numeric', month: 'long', day: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });

  const highRisk   = auditEvents.filter(e => e.riskLevel === 'High');
  const medRisk    = auditEvents.filter(e => e.riskLevel === 'Medium');
  const bonuses    = adjustments.filter(a => a.type === 'bonus');
  const deductions = adjustments.filter(a => a.type === 'deduction');
  const netDelta   = adjustments.reduce((s, a) => s + a.delta, 0);

  const scoreColor = score >= 70 ? '#1e6f3e' : score >= 40 ? '#b45309' : '#b91c1c';
  const riskColor  = { High: '#b91c1c', Medium: '#b45309', Low: '#1e6f3e', None: '#6b7280' };

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sevLabel(s) {
    return { critical: 'Critical', warning: 'Warning', info: 'Informational' }[s] || s;
  }

  // ─ Section 3: Score breakdown rows
  const breakdownRows = [...bonuses, ...deductions].map(a => `
    <tr>
      <td><code>${esc(a.id)}</code></td>
      <td>${esc(a.category)}</td>
      <td style="font-weight:700;color:${a.delta >= 0 ? '#1e6f3e' : '#b91c1c'}">${a.delta >= 0 ? '+' : ''}${a.delta}</td>
      <td>${esc(sevLabel(a.severity))}</td>
      <td>${esc(a.reason)}</td>
    </tr>`).join('');

  // ─ Section 4: Timeline rows
  const timelineRows = auditEvents.map(ev => `
    <tr>
      <td style="white-space:nowrap">${esc(ev.timestamp)}</td>
      <td>${esc(ev.plainType)}</td>
      <td style="font-weight:700;color:${riskColor[ev.riskLevel] || '#6b7280'}">${esc(ev.riskLevel)}</td>
      <td>${esc(ev.scoreImpact || '—')}</td>
      <td>${esc(ev.plainEnglishDescription)}</td>
    </tr>`).join('');

  // ─ Section 5: High risk findings
  const highRiskHtml = highRisk.length ? highRisk.map((ev, i) => {
    const ruleRows = ev.triggeredRules.map(r => {
      const evStr = Object.entries(r.evidence || {}).map(([k,v]) => `${k}: ${v}`).join(', ');
      return `
        <tr>
          <td><code>${esc(r.id)}</code></td>
          <td>${esc(r.category)}</td>
          <td>${esc(sevLabel(r.severity))}</td>
          <td style="font-weight:700;color:${r.delta < 0 ? '#b91c1c' : r.delta > 0 ? '#1e6f3e' : '#6b7280'}">${r.delta !== 0 ? (r.delta > 0 ? '+' : '') + r.delta : '—'}</td>
          <td>${esc(r.reason)}</td>
          <td style="font-family:monospace;font-size:0.82em">${esc(evStr || '—')}</td>
        </tr>`;
    }).join('');
    return `
      <div class="finding">
        <h4>Finding ${i + 1} — ${esc(ev.plainType)}</h4>
        <p><strong>Timestamp:</strong> ${esc(ev.timestamp)}</p>
        <p><strong>Description:</strong> ${esc(ev.plainEnglishDescription)}</p>
        ${ev.txHash ? `<p class="mono">Hash: ${esc(ev.txHash)}</p>` : ''}
        ${ev.memo   ? `<p><strong>Memo:</strong> ${esc(ev.memo)}</p>` : ''}
        <table style="margin-top:10px">
          <thead><tr><th>Rule</th><th>Category</th><th>Severity</th><th>Score Δ</th><th>Signal</th><th>Evidence</th></tr></thead>
          <tbody>${ruleRows}</tbody>
        </table>
      </div>`;
  }).join('') : '<p class="muted">No high risk findings identified.</p>';

  // ─ Section 6: Authorization chain by category
  const allRules = auditEvents.flatMap(ev =>
    ev.triggeredRules.map(r => ({ ...r, evTimestamp: ev.timestamp, evType: ev.plainType }))
  );
  const byCategory = {};
  allRules.forEach(r => { (byCategory[r.category] = byCategory[r.category] || []).push(r); });

  const authChainHtml = Object.keys(byCategory).length
    ? Object.entries(byCategory).map(([cat, rules]) => `
      <h4>${esc(cat)}</h4>
      <table>
        <thead><tr><th>Rule</th><th>Transaction Type</th><th>Timestamp</th><th>Severity</th><th>Signal</th></tr></thead>
        <tbody>${rules.map(r => `
          <tr>
            <td><code>${esc(r.id)}</code></td>
            <td>${esc(r.evType)}</td>
            <td style="white-space:nowrap">${esc(r.evTimestamp)}</td>
            <td>${esc(sevLabel(r.severity))}</td>
            <td>${esc(r.reason)}</td>
          </tr>`).join('')}
        </tbody>
      </table>`).join('')
    : '<p class="muted">No rules triggered in this audit.</p>';

  // ─ Section 7: Appendix rule reference
  const ruleRef = [
    ['HIST_001','History','Limited transaction history (fewer than 10 txs) — penalty'],
    ['HIST_002','History','Established wallet (10+ txs) — bonus'],
    ['VOL_001','Volume','Very large payment >100,000 XRP — critical penalty'],
    ['VOL_002','Volume','Large payment >1,000 XRP — warning penalty'],
    ['COMP_001','Compliance','Failed on-chain transaction — penalty per occurrence'],
    ['COMP_002','Compliance','Majority of payments include memo references — bonus'],
    ['BEHAV_001','Behavioral','Account deletion detected — critical penalty'],
    ['BEHAV_002','Behavioral','Escrow payment usage — bonus'],
    ['BEHAV_003','Behavioral','Frequent signing key changes (>2) — penalty'],
    ['BEHAV_004','Behavioral','Payment to unrecognized counterparty — penalty'],
    ['BEHAV_005','Behavioral','Transaction outside normal operating hours — penalty'],
    ['CNTR_001','Counterparty','Excessive trust lines created — penalty'],
    ['CNTR_002','Counterparty','High DEX order volume (>10 offers) — signal'],
    ['NFT_001','Counterparty','High-volume NFT minting (>10 tokens) — signal'],
  ].map(([id, cat, desc]) => `
    <tr>
      <td><code>${esc(id)}</code></td>
      <td>${esc(cat)}</td>
      <td>${esc(desc)}</td>
    </tr>`).join('');

  return `<!DOCTYPE html>

function exportPDF() {
  if (!_auditState) {
    alert('Run an audit or load the demo first, then export.');
    return;

  const win = window.open('', '_blank');
  if (!win) {

    return;

  const html = buildComplianceReport(_auditState);
  win.document.open();
  win.document.write(html);
  win.document.close();
  setTimeout(() => { try { win.print(); } catch(e) {} }, 700);
}
